name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=@artemis/api

      - name: Lint workspaces
        run: npm run lint

      - name: Build workspaces
        run: npm run build

      - name: Run API unit tests with coverage
        run: npm run test:cov --workspace=@artemis/api

      - name: Run API end-to-end tests
        run: npm run test:e2e
